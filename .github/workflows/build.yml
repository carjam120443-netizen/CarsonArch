name: Build CarsonArch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build.sh"
      - "profile/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archiso git sudo

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify ISO output
        run: |
          test -n "$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          ls -lh out/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonarch-iso
          path: out/*.iso
          if-no-files-found: error

name: Build CarsonArch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build.sh"
      - "profile/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ArchISO
        run: |
          pacman -Syu --noconfirm archiso

      - name: Build yay from the AUR
        run: |
          pacman -S --needed --noconfirm git base-devel go
          useradd --create-home --shell /bin/bash carson-yay
          mkdir -p /opt/yay
          chown -R carson-yay:carson-yay /opt/yay
          runuser -u carson-yay -- git clone --depth 1 https://aur.archlinux.org/yay.git /opt/yay/src
          runuser -u carson-yay -- bash -c "cd /opt/yay/src && makepkg --noconfirm --syncdeps"
          # yay builds a split debug package too; only carry the main package into the ISO.\n          YAY_PACKAGE="$(find /opt/yay/src -maxdepth 1 -type f -name 'yay-[0-9]*.pkg.tar.zst' -print -quit)"
          test -n "$YAY_PACKAGE"
          echo "YAY_PACKAGE=$YAY_PACKAGE" >> "$GITHUB_ENV"

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify ISO output
        run: |
          find out -maxdepth 1 -type f -name '*.iso' -print -exec ls -lh {} \;
          test -n "$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsonarch-iso
          path: out/*.iso
          if-no-files-found: error
